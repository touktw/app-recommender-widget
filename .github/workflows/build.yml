name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      # main에 올라갈 때마다 "latest" 릴리스에 APK를 올려서 폰 브라우저나 GitHub 앱에서 바로 받을 수 있게 한다
      - name: Publish latest APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app-recommend-widget.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest app-recommend-widget.apk \
            --title "최신 빌드" \
            --notes "main ${GITHUB_SHA::7} 빌드. 디버그 APK라 설치할 때 출처를 알 수 없는 앱 허용이 필요해요." \
            --target "$GITHUB_SHA"
